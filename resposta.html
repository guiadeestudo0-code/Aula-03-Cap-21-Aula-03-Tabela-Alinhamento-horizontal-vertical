<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gabarito-Trabalhando com alinhamento</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        table {
            width: 400px;   
            height: 400px;
        
            border-collapse: collapse;
        }
        td {
            border: 1px solid black;
            padding: 8px;

            text-align: center;

            vertical-align: middle;
        }

        .numero {
            text-align: right;
        }

        .esquerda {
            text-align: left;
            vertical-align: top;
        }
        .centro {
            text-align: center;
            vertical-align: middle;
        }
        .direita {
            text-align: right;
            vertical-align: middle;
        }
        .topo {
            text-align: center;
            vertical-align: top;
        }
        .padrão {
            text-align: center;
            vertical-align: middle;
        }
        .baixo {
            text-align: center;
            vertical-align: bottom;
        }
        .topo {
            text-align: center;
            vertical-align: top;
        }
        .baixo {
            text-align: center;
            vertical-align: bottom;
        }
        .numero-a-direita {
            text-align: right;
            vertical-align: middle;
        }
        

        .linha-fina {
            height: 50px;
            width: 50px;
        }



    </style>
</head>
<body>
    <h1>Gabarito-Trabalhando com alinhamento</h1>
    
    <!-- 
        Hierarquia de tabelas (Simples)
        Table = tabela
            Table Row = Linha da tabela
                Table Header = cabeçalho de tabela Data = dado da tabela Data = dado da tabela
    -->
    <table>
        <tr class="linha-fina"> <!-- Primeira linha -->
            <td class="esquerda">A1<br>(esquerda)
            <td class="padrão">B1<br>(padrão centro)
            <td class="direita">C1<br>(direita)
        </tr> <!-- Segunda linha -->
        <tr class="topo">
            <td class="topo">A2<br>(topo)
            <td class="padão">B2<br>(padrão)
            <td class="baixo">C2<br>(baixo)</td>
        </tr>
        <tr> <!-- Terceira linha -->
            <td class="topo">A3<br>(topo)
            <td class="baixo">B3<br>(baixo)
            <td class="padrão">C3<br>(padrão)
        </tr>
        <tr> <!-- Quarta linha -->
            <td>A4</td>
            <td class="numero-a-direita">1000<br>(número à direita</td>
            <td>C4</td>
        </tr>

    </table>
    
</body>
</html>
